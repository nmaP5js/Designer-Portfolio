<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Erreur 404 - Page introuvable. Retournez à l'accueil du portfolio de Nicolas Marie Angelique.">
    <title>Page introuvable (404) - Nicolas Marie Angelique</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --highlight-color: #888888;
            --blue-color: #388BFF;
            --menu-z: 1000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Faculty Glyphic', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            -webkit-font-smoothing: antialiased;
        }

        /* --- STICKERS (Fond) --- */
        .stickers-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .sticker {
            position: absolute;
            width: 100px;
            height: 100px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0;
            transform: scale(0.2) rotate(0deg);
            will-change: transform, opacity;
        }

        .sticker.pop-in {
            animation: popIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .sticker.zoom-in {
            animation: zoomIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .sticker.spin-in {
            animation: spinIn 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.2);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.2);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes zoomIn {
            0% {
                opacity: 0;
                transform: scale(0.1);
            }

            60% {
                opacity: 0.8;
                transform: scale(1.3);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes spinIn {
            0% {
                opacity: 0;
                transform: scale(0.2) rotate(-120deg);
            }

            70% {
                opacity: 0.7;
                transform: scale(1.1);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* --- CONTENU 404 --- */
        .error-content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            /* Laisse passer les clics pour les stickers */
        }

        .error-title {
            font-size: clamp(8rem, 20vw, 20rem);
            /* Taille énorme adaptative */
            font-weight: 800;
            line-height: 0.8;
            margin: 0;
            letter-spacing: -0.05em;
            color: var(--text-color);
        }

        .error-subtitle {
            font-size: clamp(1.2rem, 2vw, 1.5rem);
            margin-top: 20px;
            margin-bottom: 40px;
            color: var(--highlight-color);
            max-width: 600px;
        }

        .back-button {
            pointer-events: auto;
            /* Réactive le clic sur le bouton */
            display: inline-block;
            padding: 15px 40px;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(5px);
        }

        .back-button:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        /* --- BARRE DE NAVIGATION CENTRÉE EN HAUT --- */
        .top-nav {
                position: fixed;
                top: 24px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 1000;
                background-color: rgba(255, 255, 255, 0.75);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, 0.8);
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
                border-radius: 9999px;
                padding: 6px 10px;
                width: max-content;
                max-width: calc(100vw - 20px);
            }

            .top-nav-list {
                list-style: none;
                display: flex;
                align-items: center;
                gap: 4px;
            }

            .top-nav-link {
                display: inline-block;
                text-decoration: none;
                color: #111827;
                font-size: 0.95rem;
                font-weight: 500;
                padding: 8px 18px;
                border-radius: 9999px;
                transition: all 0.2s ease;
                white-space: nowrap;
            }

            .top-nav-link:hover,
            .top-nav-link.active {
                background-color: rgba(56, 139, 255, 0.1);
                color: var(--blue-color);
            }

            .top-nav-link:active {
                transform: scale(0.96);
            }

            @media (max-width: 600px) {
                .top-nav {
                    top: 14px;
                    padding: 4px 6px;
                }

                .top-nav-list {
                    gap: 2px;
                }

                .top-nav-link {
                    padding: 6px 10px;
                    font-size: 0.82rem;
                }
            }
    </style>
</head>

<body>

    <div class="stickers-container" id="stickersContainer" aria-hidden="true"></div>
    <main class="error-content">
        <h1 class="error-title">404</h1>
        <p class="error-subtitle">Oups ! Cette page s'est perdue dans mes projets.</p>
        <a href="index.html" class="back-button">Retour à l'accueil</a>
    </main>

    <script>
        // --- STICKERS FLOWER GARDEN SYSTEM ---
        const stickerConfig = {
            basePath: "stickers/",
            stickers: ["Flower1.png", "Flower2.png", "Flower3.png", "Flower4.png"],
            maxStickers: 160,
            displayTime: 65000,
            stickerSize: { min: 38, max: 88 },
            animations: ["pop-in", "zoom-in", "spin-in"]
        };

        const stickersContainer = document.getElementById('stickersContainer');
        let activeStickers = [];

        function getRandomNumber(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

        function createSticker(x, y, delay = 0, customSize = null) {
            if (!stickersContainer) return;
            if (activeStickers.length >= stickerConfig.maxStickers) {
                const oldest = activeStickers.shift();
                if (oldest) oldest.remove();
            }

            const sticker = document.createElement('div');
            const anim = stickerConfig.animations[getRandomNumber(0, stickerConfig.animations.length - 1)];
            const idx = getRandomNumber(0, stickerConfig.stickers.length - 1);

            sticker.className = `sticker ${anim}`;
            sticker.style.backgroundImage = `url('${stickerConfig.basePath + stickerConfig.stickers[idx]}')`;

            const size = customSize || getRandomNumber(stickerConfig.stickerSize.min, stickerConfig.stickerSize.max);

            const clampedX = Math.max(8, Math.min(x - size / 2, window.innerWidth - size - 8));
            const clampedY = Math.max(8, Math.min(y - size / 2, window.innerHeight - size - 8));

            sticker.style.left = `${clampedX}px`;
            sticker.style.top = `${clampedY}px`;
            sticker.style.width = `${size}px`;
            sticker.style.height = `${size}px`;
            sticker.style.transform = `scale(0.2) rotate(${getRandomNumber(-35, 35)}deg)`;
            sticker.style.animationDelay = `${delay}ms`;

            stickersContainer.appendChild(sticker);
            activeStickers.push(sticker);

            const lifeTime = stickerConfig.displayTime + getRandomNumber(-1500, 1500);
            setTimeout(() => {
                if (sticker.parentNode) {
                    sticker.style.opacity = '0';
                    sticker.style.transform = 'scale(0.2)';
                    setTimeout(() => {
                        sticker.remove();
                        const index = activeStickers.indexOf(sticker);
                        if (index > -1) activeStickers.splice(index, 1);
                    }, 500);
                }
            }, lifeTime + delay);
        }

        // Fait éclore un massif floral
        function spawnBouquet(cx, cy, count = 6, radius = 70, baseDelay = 0) {
            for (let i = 0; i < count; i++) {
                let x, y, size;
                if (i === 0) {
                    x = cx + (Math.random() - 0.5) * 14;
                    y = cy + (Math.random() - 0.5) * 14;
                    size = getRandomNumber(55, 88);
                } else {
                    const angle = (i / (count - 1)) * Math.PI * 2 + (Math.random() - 0.5) * 0.7;
                    const dist = (0.28 + Math.pow(Math.random(), 0.8) * 0.72) * radius;
                    x = cx + Math.cos(angle) * dist;
                    y = cy + Math.sin(angle) * dist;
                    size = getRandomNumber(38, 75);
                }
                createSticker(x, y, baseDelay + i * 45, size);
            }
        }

        function getRandomScatterPosition() {
            const margin = 40;
            const w = window.innerWidth;
            const h = window.innerHeight;
            let x, y, attempts = 0;
            do {
                x = getRandomNumber(margin, w - margin);
                y = getRandomNumber(margin, h - margin);
                attempts++;
                const inCenter = (x > w * 0.35 && x < w * 0.65 && y > h * 0.35 && y < h * 0.65);
                if (!inCenter || attempts > 10) break;
            } while (true);
            return { x, y };
        }

        function initGarden() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const isMobile = w < 600;

            const beds = isMobile ? [
                { x: w * 0.18, y: h * 0.22, count: 5, r: 42 },
                { x: w * 0.82, y: h * 0.22, count: 5, r: 42 },
                { x: w * 0.22, y: h * 0.80, count: 5, r: 42 },
                { x: w * 0.78, y: h * 0.78, count: 5, r: 42 }
            ] : [
                { x: w * 0.16, y: h * 0.24, count: 6, r: 70 },
                { x: w * 0.84, y: h * 0.22, count: 6, r: 70 },
                { x: w * 0.14, y: h * 0.76, count: 6, r: 70 },
                { x: w * 0.84, y: h * 0.78, count: 6, r: 70 },
                { x: w * 0.50, y: h * 0.88, count: 5, r: 60 }
            ];

            let delay = 0;
            beds.forEach((bed) => {
                const jitterX = (Math.random() - 0.5) * (w * 0.07);
                const jitterY = (Math.random() - 0.5) * (h * 0.05);
                spawnBouquet(bed.x + jitterX, bed.y + jitterY, bed.count, bed.r, delay);
                delay += 180;
            });

            const scatterCount = isMobile ? 6 : 14;
            for (let i = 0; i < scatterCount; i++) {
                const pos = getRandomScatterPosition();
                createSticker(pos.x, pos.y, delay + i * 65);
            }
        }

        document.addEventListener('click', (e) => {
            if (e.target.closest('.top-nav, .back-button')) return;
            spawnBouquet(e.clientX, e.clientY, getRandomNumber(4, 6), 55, 0);
            const extraCount = getRandomNumber(1, 2);
            for (let i = 0; i < extraCount; i++) {
                const pos = getRandomScatterPosition();
                createSticker(pos.x, pos.y, 100 + i * 80);
            }
        });

        window.addEventListener('load', initGarden);
    </script>
</body>

</html>
