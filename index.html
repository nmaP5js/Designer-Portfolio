<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio de Nicolas Marie Angelique - Designer. Projets, À Propos et Contact.">
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nicolasmarieangelique.fr/">
    <meta property="og:title" content="Nicolas Marie Angelique - Designer UI/UX & 3D">
    <meta property="og:description" content="Découvrez mon portfolio : Design d'interface, Branding et Création 3D.">
    <meta property="og:image" content="https://nicolasmarieangelique.fr/images/aperçu_img.png">
    
    <link rel="icon" type="image/png" href="stickers/sticker1.png">
    <link rel="shortcut icon" type="image/png" href="stickers/sticker1.png">
    
    <title>Nicolas Marie Angelique - Accueil</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --highlight-color: #888888;
            --blue-color: #388BFF;
            --line-color: #e0e0e0;
            --menu-z: 1000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter Tight', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* --- STICKERS (Couche au-dessus du logo mais sous le menu) --- */
        .stickers-container {
            position: fixed; 
            inset: 0; 
            pointer-events: none; 
            z-index: 10; /* Assez haut pour être devant le logo */
            overflow: hidden;
        }
        .sticker {
            position: absolute; width: 100px; height: 100px; background-size: contain;
            background-repeat: no-repeat; background-position: center; opacity: 0;
            transform: scale(0.2); will-change: transform, opacity;
        }
        
        .sticker.pop-in { animation: popIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .sticker.zoom-in { animation: zoomIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .sticker.spin-in { animation: spinIn 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
        
        @keyframes popIn { 
            0% { opacity: 0; transform: scale(0.2) rotate(0deg); } 
            50% { opacity: 0.8; transform: scale(1.2) rotate(15deg); } 
            100% { opacity: 1; transform: scale(1) rotate(0deg); } 
        }
        @keyframes zoomIn { 
            0% { opacity: 0; transform: scale(0.1) rotate(-20deg); } 
            60% { opacity: 0.8; transform: scale(1.3) rotate(10deg); } 
            100% { opacity: 1; transform: scale(1) rotate(0deg); } 
        }
        @keyframes spinIn { 
            0% { opacity: 0; transform: scale(0.2) rotate(-120deg); } 
            70% { opacity: 0.7; transform: scale(1.1) rotate(20deg); } 
            100% { opacity: 1; transform: scale(1) rotate(0deg); } 
        }

        /* --- BARRE DE NAVIGATION CENTRÉE EN HAUT --- */
        .top-nav {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background-color: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            border-radius: 9999px;
            padding: 6px 10px;
            width: max-content;
            max-width: calc(100vw - 20px);
        }

        .top-nav-list {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .top-nav-link {
            display: inline-block;
            text-decoration: none;
            color: #111827;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 8px 18px;
            border-radius: 9999px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .top-nav-link:hover, .top-nav-link.active {
            background-color: rgba(56, 139, 255, 0.1);
            color: var(--blue-color);
        }

        .top-nav-link:active {
            transform: scale(0.96);
        }

        @media (max-width: 600px) {
            .top-nav { top: 14px; padding: 4px 6px; }
            .top-nav-list { gap: 2px; }
            .top-nav-link { padding: 6px 10px; font-size: 0.82rem; }
        }

        /* --- HERO SECTION --- */
        .hero-section {
            width: 100%; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            position: relative; 
            z-index: 1; /* Sous les stickers */
        }
        .logo-container { 
            width: 80%; 
            max-width: 420px; 
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            pointer-events: none; 
        }
        .logo-img { 
            width: 100%; 
            height: auto; 
            display: block; 
            object-fit: contain; 
        }

        @media (max-width: 600px) {
            .top-nav { top: 16px; padding: 4px 6px; }
            .top-nav-link { padding: 6px 12px; font-size: 0.85rem; }
            .hero-section { min-height: 100vh; }
            .logo-container { width: 80%; max-width: 290px; }
        }
    </style>
</head>
<body>

    <div class="stickers-container" id="stickersContainer" aria-hidden="true"></div>

    <nav class="top-nav" aria-label="Navigation principale">
        <ul class="top-nav-list">
            <li><a href="index.html" class="top-nav-link active">Accueil</a></li>
            <li><a href="project.html" class="top-nav-link">Projets</a></li>
            <li><a href="about.html" class="top-nav-link">À Propos</a></li>
            <li><a href="contact.html" class="top-nav-link">Contact</a></li>
        </ul>
    </nav>

    <header class="hero-section">
        <div class="logo-container">
            <img src="images/logo.svg" alt="Nicolas Marie Angelique" class="logo-img">
        </div>
    </header>

    <script>
    // --- STICKERS BACKGROUND ---
    const stickerConfig = {
        basePath: "stickers/", 
        stickers: ["sticker1.png", "sticker2.png", "sticker3.png", "sticker4.png", "sticker5.png"],
        maxStickers: 100, 
        displayTime: 60000, 
        stickerSize: { min: 90, max: 270 }, 
        randomPositionMargin: 60,
        animations: ["pop-in", "zoom-in", "spin-in"]
    };

    const stickersContainer = document.getElementById('stickersContainer');
    let activeStickers = [];

    function getRandomNumber(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function getRandomPosition() {
        const w = document.documentElement.scrollWidth;
        const h = document.documentElement.scrollHeight;
        const margin = stickerConfig.randomPositionMargin;
        return {
            x: getRandomNumber(margin, w - margin),
            y: getRandomNumber(margin, h - margin)
        };
    }

    function createSticker(x, y, isRandom = false, delay = 0) {
        if (!stickersContainer) return;
        if (activeStickers.length >= stickerConfig.maxStickers) {
            const oldestSticker = activeStickers.shift();
            if (oldestSticker) oldestSticker.remove();
        }
        
        const sticker = document.createElement('div');
        const animationClass = stickerConfig.animations[getRandomNumber(0, stickerConfig.animations.length - 1)];
        const randomStickerIndex = getRandomNumber(0, stickerConfig.stickers.length - 1);
        
        sticker.className = `sticker ${animationClass}`;
        sticker.style.backgroundImage = `url('${stickerConfig.basePath + stickerConfig.stickers[randomStickerIndex]}')`;
        
        let posX = isRandom ? x : (x + window.pageXOffset);
        let posY = isRandom ? y : (y + window.pageYOffset);

        sticker.style.left = `${posX}px`;
        sticker.style.top = `${posY}px`;
        
        const size = getRandomNumber(stickerConfig.stickerSize.min, stickerConfig.stickerSize.max);
        sticker.style.width = `${size}px`;
        sticker.style.height = `${size}px`;
        sticker.style.transform = `scale(0.2) rotate(${getRandomNumber(-30, 30)}deg)`;
        sticker.style.animationDelay = `${delay}ms`;
        
        stickersContainer.appendChild(sticker);
        activeStickers.push(sticker);
        
        const lifeTime = isRandom 
            ? stickerConfig.displayTime + getRandomNumber(-1000, 1000) 
            : stickerConfig.displayTime;
        
        setTimeout(() => {
            if (sticker.parentNode) {
                sticker.style.opacity = 0;
                sticker.style.transform = 'scale(0.2)'; 
                setTimeout(() => {
                    sticker.remove();
                    const index = activeStickers.indexOf(sticker);
                    if (index > -1) activeStickers.splice(index, 1);
                }, 500);
            }
        }, lifeTime + delay);
    }

    function createThreeStickers(x, y) {
        createSticker(x, y);
        const p1 = getRandomPosition();
        const p2 = getRandomPosition();
        createSticker(p1.x, p1.y, true, 150); 
        createSticker(p2.x, p2.y, true, 300); 
    }

    document.addEventListener('click', (e) => {
        if (e.target.closest('button, a, .top-nav')) return;
        createThreeStickers(e.clientX, e.clientY);
    });

    window.addEventListener('load', () => {
        for (let i = 0; i < 3; i++) {
            const p = getRandomPosition();
            createSticker(p.x, p.y, true, i * 200);
        }
    });
    </script>
</body>
</html>
