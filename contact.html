<head>

    <title>Nicolas Marie Angélique - Contact</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --highlight-color: #2e2e2e;
            --blue-color: #388BFF;
            --menu-z: 1000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter Tight', sans-serif;
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            position: relative;
            cursor: default; /* Curseur par défaut pour pouvoir écrire */
            -webkit-font-smoothing: antialiased;
        }

        /* --- STICKERS --- */
        .stickers-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        
        .sticker {
            position: absolute;
            width: 100px;
            height: 100px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0;
            transform: scale(0.2) rotate(0deg);
            will-change: transform, opacity; 
        }
        
        .sticker.pop-in { animation: popIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .sticker.zoom-in { animation: zoomIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .sticker.spin-in { animation: spinIn 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
        
        @keyframes popIn { 
            0% { opacity: 0; transform: scale(0.2) rotate(0deg); } 
            50% { opacity: 0.6; transform: scale(1.2) rotate(15deg); } 
            100% { opacity: 0.4; transform: scale(1) rotate(0deg); }
        }
        @keyframes zoomIn { 
            0% { opacity: 0; transform: scale(0.1) rotate(-20deg); } 
            60% { opacity: 0.6; transform: scale(1.3) rotate(10deg); } 
            100% { opacity: 0.4; transform: scale(1) rotate(0deg); }
        }
        @keyframes spinIn { 
            0% { opacity: 0; transform: scale(0.2) rotate(-120deg); } 
            70% { opacity: 0.5; transform: scale(1.1) rotate(20deg); } 
            100% { opacity: 0.4; transform: scale(1) rotate(0deg); }
        }

        /* --- BOUTON MENU --- */
        .menu-btn {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: calc(var(--menu-z) + 1);
            cursor: pointer;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease, background-color 0.3s ease;
            background-color: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 50%;
            border: none;
            color: var(--text-color);
        }
        .menu-btn:hover { transform: scale(1.1); background-color: rgba(0, 0, 0, 0.05); }
        .menu-btn .material-symbols-outlined { font-size: 30px; }

        /* --- MENU CAPSULE (NOUVEAU STYLE) --- */
        .nav-capsule {
            position: fixed;
            top: 90px;
            right: 30px;
            width: 260px;
            
            /* Effet Verre Dépoli */
            background-color: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            z-index: var(--menu-z);
            
            /* Animation d'entrée */
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px) scale(0.95);
            transform-origin: top right;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .nav-capsule.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .capsule-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .capsule-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: var(--text-color);
            font-size: 1.1rem;
            font-weight: 500;
            padding: 10px 15px;
            border-radius: 12px;
            transition: background-color 0.2s ease, color 0.2s ease;
            cursor: pointer;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
            font-family: 'Inter Tight', sans-serif;
        }

        .capsule-link:hover {
            background-color: rgba(255, 255, 255, 0.5);
            color: var(--blue-color);
        }

        /* Sous-menu Projets */
        .chevron {
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .project-trigger[aria-expanded="true"] .chevron {
            transform: rotate(180deg);
        }

        .submenu {
            list-style: none;
            margin-left: 15px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border-left: 2px solid rgba(0,0,0,0.05);
        }

        .submenu.open {
            max-height: 200px;
            margin-top: 5px;
            margin-bottom: 5px;
        }

        .submenu li a {
            display: block;
            text-decoration: none;
            color: #666;
            font-size: 0.95rem;
            padding: 8px 15px;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .submenu li a:hover {
            color: var(--blue-color);
            transform: translateX(5px);
        }

        .submenu .all-projects {
            font-weight: 600;
            color: var(--text-color);
            font-size: 0.85rem;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* --- LAYOUT --- */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
            position: relative;
            z-index: 1; 
        }

        /* Zone Gauche */
        .left-panel {
            flex: 1.5;
            padding: 120px 80px;
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
        }

        .quote-block h1 {
            font-size: clamp(1.85rem, 3.2vw, 3.2rem); 
            font-weight: 600;
            line-height: 1.15;
            margin-bottom: 0;
            color: var(--text-color);
            letter-spacing: -0.03em;
        }

        .footer-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 0.9rem;
            color: var(--text-color);
            font-weight: 500;
        }
        
        .footer-role { color: var(--highlight-color); }

        /* Zone Droite (Formulaire) */
        .right-panel {
            flex: 1.5;
            background-color: transparent; 
            padding: 120px 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto; /* Permet le scroll si le formulaire est haut */
        }

        /* --- STYLE DU FORMULAIRE --- */
        .contact-form {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .form-group {
            position: relative;
            width: 100%;
        }

        /* Inputs Minimalistes */
        .form-input, .form-textarea {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #cccccc;
            padding: 10px 0;
            font-family: 'Inter Tight', sans-serif;
            font-size: 1.1rem;
            color: var(--text-color);
            outline: none;
            transition: border-color 0.3s ease;
            border-radius: 0; /* Reset iOS */
        }

        .form-input::placeholder, .form-textarea::placeholder {
            color: var(--highlight-color);
            opacity: 0.6;
            font-size: 1rem;
        }

        .form-input:focus, .form-textarea:focus {
            border-bottom-color: var(--blue-color);
        }

        .label-field {
            font-size: 0.85rem;
            text-transform: none;
            color: var(--highlight-color);
            margin-bottom: 5px;
            font-weight: 600;
            display: block;
        }

        .form-textarea {
            resize: none;
            min-height: 100px;
        }

        .direct-email-link {
            font-size: 2rem;
            font-weight: 600;
            color: var(--text-color);
            text-decoration: none;
            display: inline-block;
            margin-top: 12px;
            word-break: break-all;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .direct-email-link:hover {
            color: var(--blue-color);
            transform: translateX(4px);
        }

        @media (max-width: 600px) {
            .direct-email-link { font-size: 1.35rem; }
        }

        /* --- BOUTONS CTA STYLE SHADCN/UI --- */
        .social-links-row {
            margin-top: 36px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .shadcn-btn-outline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background-color: #ffffff;
            border: 1px solid #e4e4e7;
            color: #18181b;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .shadcn-btn-outline:hover {
            background-color: #f4f4f5;
            border-color: #d4d4d8;
            color: #09090b;
            transform: translateY(-1px);
            box-shadow: 0 2px 5px 0 rgba(0, 0, 0, 0.06);
        }

        .shadcn-btn-outline:active {
            transform: scale(0.98);
        }

        .shadcn-icon {
            font-size: 15px !important;
            opacity: 0.6;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .shadcn-btn-outline:hover .shadcn-icon {
            opacity: 1;
            transform: translate(2px, -2px);
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 900px) {
            body { overflow-y: auto; display: block; }
            .container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }
            
            .left-panel {
                padding: 120px 40px 40px 40px;
                flex: none;
            }
            
            .quote-block h1 { font-size: 2.5rem; }
            
            .right-panel {
                padding: 0 40px 80px 40px;
                flex: none;
            }
        }
        
        /* --- BARRE DE NAVIGATION CENTRÉE EN HAUT --- */
        .top-nav {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background-color: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            border-radius: 9999px;
            padding: 6px 10px;
            width: max-content;
            max-width: calc(100vw - 20px);
        }

        .top-nav-list {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .top-nav-link {
            display: inline-block;
            text-decoration: none;
            color: #111827;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 8px 18px;
            border-radius: 9999px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .top-nav-link:hover, .top-nav-link.active {
            background-color: rgba(56, 139, 255, 0.1);
            color: var(--blue-color);
        }

        .top-nav-link:active {
            transform: scale(0.96);
        }

        @media (max-width: 600px) {
            .top-nav { top: 14px; padding: 4px 6px; }
            .top-nav-list { gap: 2px; }
            .top-nav-link { padding: 6px 10px; font-size: 0.82rem; }
        }
    </style>
</head>
<body>

    <div class="stickers-container" id="stickersContainer" aria-hidden="true"></div>

    <nav class="top-nav" aria-label="Navigation principale">
        <ul class="top-nav-list">
            <li><a href="index.html" class="top-nav-link">Accueil</a></li>
            <li><a href="project.html" class="top-nav-link">Projets</a></li>
            <li><a href="about.html" class="top-nav-link">À Propos</a></li>
            <li><a href="contact.html" class="top-nav-link active">Contact</a></li>
        </ul>
    </nav>

    <main class="container">
        
        <section class="left-panel" style="max-width: 900px; width: 100%;">
            <div class="quote-block">
                <h1>
                    Mon parcours vous intéresse&nbsp;? <br>
                    <span style="color: var(--blue-color);">Contactez-moi directement&nbsp;ici.</span>
                </h1>
            </div>

            <div class="direct-contact-block" style="margin-top: 40px;">
                <span class="label-field">Email direct</span>
                <a href="mailto:nmafreelance@gmail.com" class="direct-email-link">nmafreelance@gmail.com</a>
            </div>
            
            <div class="social-links-row" style="margin-top: 32px;">
                <a href="https://linkedin.com/in/nicolasmarieangelique" target="_blank" rel="noopener noreferrer" class="shadcn-btn-outline">
                    <span>LinkedIn</span>
                    <span class="material-symbols-outlined shadcn-icon">arrow_outward</span>
                </a>
                <a href="https://github.com/nmaP5js?tab=overview&from=2025-12-01&to=2025-12-31" target="_blank" rel="noopener noreferrer" class="shadcn-btn-outline">
                    <span>GitHub</span>
                    <span class="material-symbols-outlined shadcn-icon">arrow_outward</span>
                </a>
                <a href="https://dribbble.com/nicolasmarieangelique" target="_blank" rel="noopener noreferrer" class="shadcn-btn-outline">
                    <span>Dribbble</span>
                    <span class="material-symbols-outlined shadcn-icon">arrow_outward</span>
                </a>
                <a href="https://www.instagram.com/nma_png/" target="_blank" rel="noopener noreferrer" class="shadcn-btn-outline">
                    <span>Instagram</span>
                    <span class="material-symbols-outlined shadcn-icon">arrow_outward</span>
                </a>
            </div>

            <div class="footer-info" style="margin-top: 50px;">
                <span>Nicolas Marie Angélique</span>
                <span class="footer-role">Designer</span>
                <a href="legals.html" style="font-size: 0.8rem; color: var(--highlight-color); text-decoration: none; margin-top: 15px; display: block;">Mentions Légales</a>
            </div>
        </section>

    </main>

    <script>
        // --- STICKERS ---
        const stickerConfig = {
            basePath: "stickers/", 
            stickers: ["sticker1.png", "sticker2.png", "sticker3.png", "sticker4.png", "sticker5.png"],
            maxStickers: 100, 
            displayTime: 60000, 
            stickerSize: { min: 60, max: 200 }, 
            randomPositionMargin: 60,
            animations: ["pop-in", "zoom-in", "spin-in"]
        };

        let activeStickers = [];

        function getRandomNumber(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function getRandomPosition() {
            const pageWidth = window.innerWidth;
            const pageHeight = window.innerHeight;
            const margin = stickerConfig.randomPositionMargin;
            return {
                x: getRandomNumber(margin, pageWidth - margin),
                y: getRandomNumber(margin, pageHeight - margin)
            };
        }

        function createSticker(x, y, isRandom = false, delay = 0) {
            const container = document.getElementById('stickersContainer');
            if (!container) return;

            if (activeStickers.length >= stickerConfig.maxStickers) {
                const oldest = activeStickers.shift();
                if (oldest && oldest.parentNode) {
                    oldest.remove(); 
                }
            }
            
            const sticker = document.createElement('div');
            sticker.className = `sticker ${stickerConfig.animations[getRandomNumber(0, stickerConfig.animations.length - 1)]}`;
            
            const stickerIndex = getRandomNumber(0, stickerConfig.stickers.length - 1);
            sticker.style.backgroundImage = `url('${stickerConfig.basePath + stickerConfig.stickers[stickerIndex]}')`;
            
            const posX = isRandom ? x : x;
            const posY = isRandom ? y : y;
            
            sticker.style.left = `${posX}px`;
            sticker.style.top = `${posY}px`;
            
            const size = getRandomNumber(stickerConfig.stickerSize.min, stickerConfig.stickerSize.max);
            sticker.style.width = `${size}px`;
            sticker.style.height = `${size}px`;
            sticker.style.transform = `scale(0.2) rotate(${getRandomNumber(-30, 30)}deg)`;
            
            container.appendChild(sticker);
            activeStickers.push(sticker);
            
            const displayTime = isRandom ? stickerConfig.displayTime + getRandomNumber(-1000, 1000) : stickerConfig.displayTime;
            
            setTimeout(() => {
                if (sticker.parentNode) {
                    sticker.style.opacity = '0';
                    sticker.style.transform = 'scale(0.2)';
                    setTimeout(() => {
                        if (sticker.parentNode) {
                            sticker.remove();
                            activeStickers = activeStickers.filter(s => s !== sticker);
                        }
                    }, 500);
                }
            }, displayTime + delay);
        }

        function createThreeStickers(clickX, clickY) {
            createSticker(clickX, clickY);
            const p1 = getRandomPosition();
            const p2 = getRandomPosition();
            createSticker(p1.x, p1.y, true, 150); 
            createSticker(p2.x, p2.y, true, 300); 
        }

        document.addEventListener('click', function(e) {
            if (e.target.closest('input, textarea, button, a, .top-nav')) return;
            createThreeStickers(e.clientX, e.clientY);
        });

        window.addEventListener('load', () => {
            for (let i = 0; i < 3; i++) {
                const p = getRandomPosition();
                createSticker(p.x, p.y, true, i * 200);
            }
        });
    </script>
    
</body>
