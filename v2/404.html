<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Erreur 404 — Page introuvable.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20261119">
    <title>404 — Nicolas Marie-Angélique</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/main.css?v=20261119">

    <style>
        .error-wrap {
            min-height: 100vh;
            padding-top: var(--nav-height);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 16px;
            padding-inline: 24px;
        }

        .error-code {
            font-family: var(--font-mono);
            font-size: clamp(4.5rem, 14vw, 10rem);
            font-weight: 500;
            line-height: 0.95;
            letter-spacing: -0.05em;
            color: var(--text-color);
        }

        .error-msg {
            font-size: 1rem;
            color: var(--text-secondary);
            max-width: 46ch;
            margin-bottom: 12px;
        }
    </style>

<body>
    <nav class="top-nav" aria-label="Navigation principale"></nav>

    <main class="error-wrap">
        <span class="article-category">ERROR_404 // NOT FOUND</span>
        <h1 class="error-code">404</h1>
        <p class="error-msg">Cette page est introuvable ou a été déplacée.</p>
        <a href="index.html" class="cta-button">Retour à l'accueil</a>

    <script src="js/nav.js?v=20261119" defer></script>
