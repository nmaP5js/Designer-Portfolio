<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio de Nicolas Marie Angelique - Designer. Projets, À Propos et Contact.">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nicolasmarieangelique.fr/">
    <meta property="og:title" content="Nicolas Marie Angelique - Designer UI/UX & 3D">
    <meta property="og:description" content="Découvrez mon portfolio : Design d'interface, Branding et Création 3D.">
    <meta property="og:image" content="https://nicolasmarieangelique.fr/images/apercu_img.png">
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://nicolasmarieangelique.fr/">
    <meta property="twitter:title" content="Nicolas Marie Angelique - Designer UI/UX & 3D">
    <meta property="twitter:description" content="Découvrez mon portfolio : Design d'interface, Branding et Création 3D.">
    <meta property="twitter:image" content="https://nicolasmarieangelique.fr/images/apercu_img.png">
    <link rel="canonical" href="https://nicolasmarieangelique.fr/">

    <link rel="icon" type="image/png" href="stickers/sticker1.png">
    <link rel="shortcut icon" type="image/png" href="stickers/sticker1.png">

    <title>Nicolas Marie Angelique - Accueil</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic&display=swap" rel="stylesheet">
    <!-- Design System CSS Centralisé -->
    <link rel="stylesheet" href="css/main.css">

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --highlight-color: #888888;
            --blue-color: #388BFF;
            --line-color: #e0e0e0;
            --menu-z: 1000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Faculty Glyphic', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* --- HERO SECTION --- */
        .hero-section {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        .logo-container {
            width: 80%;
            max-width: 420px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            pointer-events: none;
        }
        .logo-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        @media (max-width: 600px) {
            .hero-section { min-height: 100vh; }
            .logo-container { width: 80%; max-width: 290px; }
        }
    </style>
</head>
<body>

    <div class="stickers-container" id="stickersContainer" aria-hidden="true"></div>

    <nav class="top-nav" aria-label="Navigation principale"></nav>

    <header class="hero-section">
        <div class="logo-container">
            <img src="images/Group@2x.png" alt="Nicolas Marie Angelique" class="logo-img">
        </div>
    </header>

    <!-- Système de stickers centralisé — pleine opacité sur la page d'accueil -->
    <script>window._stickersManualInit = true;</script>
    <script src="js/stickers.js" defer></script>
    <script>
    window.addEventListener('load', function () {
        window.initStickers({ finalOpacity: 1 });
    });
    </script>
    <script src="js/nav.js" defer></script>
</body>
</html>
